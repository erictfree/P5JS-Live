<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audio dialog visual comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; background: #1b1920; color: #fff; font: 14px/1.4 monospace; }
      main { display: flex; gap: 12px; align-items: flex-start; }
      figure { width: 264px; margin: 0; }
      figcaption { margin: 0 0 8px; font-weight: 700; }
      img { display: block; width: 264px; height: auto; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Reference</figcaption>
        <img src="p5js-live-dialog-ref-card.png" alt="Reference dialog" />
      </figure>
      <figure>
        <figcaption>Implementation</figcaption>
        <img src="p5js-live-dialog-app-card-1.png" alt="Implemented dialog" />
      </figure>
    </main>
  </body>
</html>
